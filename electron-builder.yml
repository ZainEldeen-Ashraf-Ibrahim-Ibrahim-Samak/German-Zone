# German Zone is a separate application from the old nursery system, not an upgrade
# of it. The distinct appId makes NSIS install it alongside the existing app rather
# than replacing it, and productName gives it its own userData directory, so the two
# keep entirely separate databases and can be run on the same machine.
appId: com.germanzone.management
productName: German Zone
publish:
  provider: github
  owner: ZainEldeen-Ashraf-Ibrahim-Ibrahim-Samak
  repo: German-Zone
  releaseType: release
directories:
  output: release
  buildResources: assets
files:
  - dist
  - dist-electron
  - package.json
  # Runtime assets the app reads/copies on first launch (branding logos, app icon, fonts).
  # Bundled inside the asar so the existing `path.join(__dirname, '../assets/...')` resolves.
  - assets/branding/**/*
  - assets/default-branding/**/*

win:
  target: nsis
  icon: assets/branding/icon.ico
  executableName: GermanZone
  artifactName: german-zone-setup-${version}.${ext}
mac:
  target: dmg
  icon: assets/branding/icon.icns
  category: public.app-category.business
linux:
  target: AppImage
  icon: assets/branding/icon.png
  category: Office
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: German Zone
