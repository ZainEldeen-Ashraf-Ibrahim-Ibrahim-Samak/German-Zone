# appId and the publish repo intentionally keep their original values: NSIS and
# electron-updater identify an installation by appId, so changing it would make the
# German Zone build install alongside the old one rather than upgrade it, and existing
# centres would stop receiving updates. The rebrand is therefore limited to user-facing
# names. Existing databases and branding assets are carried across by the userData
# migration in electron/db/legacyDataMigration.ts, which runs on first launch.
appId: com.germanzone.management
productName: German Zone
publish:
  provider: github
  owner: ZainEldeen-Ashraf-Ibrahim-Ibrahim-Samak
  repo: German-Zone
  releaseType: release
directories:
  output: release
  buildResources: assets
files:
  - dist
  - dist-electron
  - package.json
  # Runtime assets the app reads/copies on first launch (branding logos, app icon, fonts).
  # Bundled inside the asar so the existing `path.join(__dirname, '../assets/...')` resolves.
  - assets/branding/**/*
  - assets/default-branding/**/*

win:
  target: nsis
  icon: assets/branding/icon.ico
  executableName: GermanZone
  artifactName: german-zone-setup-${version}.${ext}
mac:
  target: dmg
  icon: assets/branding/icon.icns
  category: public.app-category.business
linux:
  target: AppImage
  icon: assets/branding/icon.png
  category: Office
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: German Zone
